<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Menu Dọc</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f2f2f2;
        }

        h1 {
            margin-bottom: 20px;
        }

        #menu ul {
            list-style: none;
        }

        #menu > ul > li {
            position: relative;
            width: 160px;
            height: 40px;
            padding: 0 20px;
            background-color: black;
            line-height: 40px;
            cursor: pointer;
            border-bottom: 1px solid #444;
        }

        #menu li a {
            text-decoration: none;
            color: white;
            display: block;
        }

        #menu li:hover {
            background-color: #555;
        }

        #menu ul ul {
            position: absolute;
            top: 0;
            left: 160px;
            width: 160px;
            visibility: hidden;
        }

        #menu li:hover > ul {
            visibility: visible;
        }

        #menu ul ul li {
            position: relative;
            width: 160px;
            height: 40px;
            padding: 0 20px;
            background-color: black;
            line-height: 40px;
            border-bottom: 1px solid #444;
        }
    </style>
</head>

<body>
    <h1>Menu Dropdown Dọc</h1>

    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>

            <li>
                <a href="#">Sản phẩm ▸</a>
                <ul>
                    <li><a href="#">Máy tính</a></li>
                    <li><a href="#">Điện thoại</a></li>
                    <li><a href="#">Phụ kiện ▸</a>
                        <ul>
                            <li><a href="#">Tai nghe</a></li>
                            <li><a href="#">Bàn phím</a></li>
                        </ul>
                    </li>
                </ul>
            </li>

            <li>
                <a href="#">Dịch vụ ▸</a>
                <ul>
                    <li><a href="#">Tư vấn</a></li>
                    <li><a href="#">Bảo hành</a></li>
                </ul>
            </li>

            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>
</body>
</html>
